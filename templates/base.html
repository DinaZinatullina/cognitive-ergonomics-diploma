<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Когнитивная эргономика{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
    <header class="top-bar">
        <div class="logo">Система когнитивной эргономики</div>
        <nav class="top-nav">
            <a href="/">Главная</a>
            {% if user.is_authenticated %}
                <span class="user-info">{{ user.username }}</span>
                <a href="/admin/">Админка</a>
            {% endif %}
        </nav>
    </header>

    <main class="content">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bottom-bar">
        <span>ВКР &copy; 2026</span>
    </footer>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
